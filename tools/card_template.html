<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#04070F">
<meta property="og:type" content="profile">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url" content="{{PAGE_URL}}">
<meta property="og:image" content="https://hyrax.tw/assets/og.jpg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2304070F'/%3E%3Ccircle cx='32' cy='32' r='13' fill='%2336E2C8'/%3E%3C/svg%3E">
<style>
/* 蹄兔數位名片模板「環球 Orbit」— 單檔、無外部資源（不連字型 CDN） */
:root{
  --bg:#04070F; --card:rgba(11,19,34,.72); --line:rgba(173,210,255,.14);
  --teal:#36E2C8; --teal-soft:#7CF0DE; --violet:#8A6CFF; --text:#E6F4FF; --dim:#8BA0BF; --on-teal:#04070F;
  --sans:'PingFang TC','Noto Sans TC','Microsoft JhengHei',system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --orbit:240px;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){--bg:#F3F7FB;--card:rgba(255,255,255,.86);--line:rgba(10,30,60,.12);--text:#0B1726;--dim:#4F6178;--teal:#0F9E89;--teal-soft:#0B7F6E;--on-teal:#fff;--term:#0B1422;--term-dim:#9FB3CC;--term-hi:#36E2C8}
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.6;-webkit-text-size-adjust:100%;overflow-x:hidden}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--teal);outline-offset:3px;border-radius:8px}
#warp{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:440px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:16px}

.demo-bar{font-size:12px;text-align:center;color:var(--dim);border:1px dashed var(--line);border-radius:999px;padding:6px 12px}
.demo-bar b{color:var(--teal);font-weight:600}

.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px 20px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 18px 50px rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;gap:14px}
.status{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--teal);display:flex;align-items:center;gap:6px;align-self:flex-start}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 8px var(--teal)}

/* 頭像＋環繞軌道 */
.orbit{position:relative;width:var(--orbit);height:var(--orbit);margin:6px 0 2px}
.ring{position:absolute;inset:0;border-radius:50%;border:1px dashed rgba(54,226,200,.35);animation:spin 80s linear infinite}
.ring.r2{inset:18%;border-style:solid;border-color:rgba(138,108,255,.28);animation:none}
.avatar{position:absolute;inset:27%;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#1b3a4f,#0a1422);border:2px solid var(--teal);box-shadow:0 0 36px rgba(54,226,200,.45);font-size:44px;font-weight:700;color:var(--teal)}
.sats{position:absolute;inset:0;animation:spin 36s linear infinite}
.sat{position:absolute;left:50%;top:50%;width:0;height:0;transform:rotate(var(--a)) translateY(calc(var(--orbit) / -2)) rotate(calc(-1 * var(--a)))}
.sat a,.sat button{position:absolute;width:40px;height:40px;transform:translate(-50%,-50%);border-radius:50%;display:grid;place-items:center;background:rgba(11,19,34,.92);border:1px solid rgba(54,226,200,.45);box-shadow:0 0 14px rgba(54,226,200,.25);animation:spin 36s linear infinite reverse;cursor:pointer;color:var(--teal)}
.sat svg{width:18px;height:18px;fill:currentColor}
@keyframes spin{to{rotate:360deg}}

h1{font-size:26px;line-height:1.3;text-align:center}
.en{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--dim);text-align:center;margin-top:-8px}
.role{font-size:14px;color:var(--dim);text-align:center}
.role b{color:var(--text);font-weight:600}
.term{width:100%;font-family:var(--mono);font-size:12px;line-height:1.8;background:var(--term,rgba(0,0,0,.28));border:1px solid var(--line);border-radius:14px;padding:10px 14px;color:var(--term-dim,var(--dim))}
.term span{color:var(--term-hi,var(--teal))}

.save{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;border-radius:16px;border:0;background:var(--teal);color:var(--on-teal);font:inherit;font-size:17px;font-weight:700;box-shadow:0 0 30px rgba(54,226,200,.35);cursor:pointer}
.save svg{width:20px;height:20px;fill:currentColor}
.actions{width:100%;display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.act{display:flex;align-items:center;gap:10px;min-height:48px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.03);font:inherit;font-size:15px;color:var(--text);cursor:pointer;text-align:left}
.act svg{width:18px;height:18px;fill:var(--teal);flex:none}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:rgba(11,19,34,.96);color:#E6F4FF;border:1px solid rgba(54,226,200,.4);padding:10px 16px;border-radius:12px;font-size:14px;transition:all .25s;z-index:10;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.badge{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;color:var(--dim);padding:10px;border-top:1px solid var(--line);margin-top:4px}
.badge a{color:var(--teal);font-weight:600}
.badge i{width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 8px var(--teal)}

@media (max-width:360px){:root{--orbit:210px}.actions{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.ring,.sats,.sat a,.sat button{animation:none}}
</style>
</head>
<body>
<canvas id="warp" aria-hidden="true"></canvas>
<main class="wrap">
  {{DEMO_BAR}}

  <section class="card" aria-label="{{NAME}}的名片">
    <span class="status">ONLINE · CARD v1</span>
    <div class="orbit">
      <div class="ring" aria-hidden="true"></div>
      <div class="ring r2" aria-hidden="true"></div>
      <div class="avatar" aria-hidden="true">{{AVATAR}}</div>
      <div class="sats">
        {{SATS}}
      </div>
    </div>

    <h1>{{NAME}}</h1>
    <p class="en">{{EN_NAME}}</p>
    <p class="role">{{ROLE}}</p>
    <div class="term" aria-label="自我介紹"{{TERMINAL_STYLE}}>{{TERMINAL}}</div>

    <a class="save" href="contact.vcf" download="{{VCF_NAME}}">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4Zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2Zm9 4c-2.7 0-8 1.3-8 4v2h16v-2c0-2.7-5.3-4-8-4Z"/></svg>
      存到我的通訊錄
    </a>
    <div class="actions">
      {{ACTIONS}}
    </div>
  </section>

  {{BADGE}}
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  var toast=document.getElementById('toast'), t;
  function say(msg){ toast.textContent=msg; toast.classList.add('show'); clearTimeout(t); t=setTimeout(function(){toast.classList.remove('show');},2600); }
  // 示範名片：按鈕只說明功能，不連到任何真人
  document.querySelectorAll('[data-demo]').forEach(function(b){
    b.addEventListener('click',function(){ say('示範名片：正式版按這裡會「'+b.getAttribute('data-demo')+'」'); });
  });
  document.getElementById('share').addEventListener('click',function(){
    var url=location.href.split('#')[0];
    if(navigator.share){ navigator.share({title:document.title,url:url}).catch(function(){}); }
    else if(navigator.clipboard){ navigator.clipboard.writeText(url).then(function(){say('已複製名片連結');},function(){say(url);}); }
    else { say(url); }
  });

  // 背景：光速星空（往中心外飛的線條）
  var cv=document.getElementById('warp'), ctx=cv.getContext('2d'), dpr=Math.min(window.devicePixelRatio||1,2);
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches, W,H,cx,cy,stars=[];
  function spawn(any){ return {a:Math.random()*Math.PI*2, d:any?Math.random()*Math.max(W,H)/1.5:Math.random()*30, v:.5+Math.random()*1.6, c:Math.random()<.2?'138,108,255':'54,226,200'}; }
  function resize(){
    W=innerWidth; H=innerHeight; cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    var o=document.querySelector('.orbit').getBoundingClientRect(); cx=o.left+o.width/2; cy=o.top+o.height/2;
    stars=[]; var n=Math.round(Math.min(140,W*H/6000)); for(var i=0;i<n;i++) stars.push(spawn(true));
  }
  function draw(step){
    ctx.clearRect(0,0,W,H);
    for(var i=0;i<stars.length;i++){
      var s=stars[i], p=s.d; s.d+=step*s.v*(1+s.d/200);
      var al=Math.min(1,s.d/280)*.6;
      ctx.strokeStyle='rgba('+s.c+','+al+')'; ctx.lineWidth=Math.min(1.8,.4+s.d/450);
      ctx.beginPath(); ctx.moveTo(cx+Math.cos(s.a)*p,cy+Math.sin(s.a)*p); ctx.lineTo(cx+Math.cos(s.a)*s.d,cy+Math.sin(s.a)*s.d); ctx.stroke();
      if(s.d>Math.max(W,H)) stars[i]=spawn(false);
    }
  }
  function loop(){ draw(1); if(!document.hidden) requestAnimationFrame(loop); }
  resize(); addEventListener('resize',resize);
  if(reduce){ draw(30); } else { requestAnimationFrame(loop); document.addEventListener('visibilitychange',function(){ if(!document.hidden) requestAnimationFrame(loop); }); }
})();
</script>
</body>
</html>
